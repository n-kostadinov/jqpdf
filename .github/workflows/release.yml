# Tag-triggered release: reruns the full CI matrix, then publishes the
# multi-platform jar to Maven Central and opens the GitHub Release.
# Preconditions live in docs/publishing.md (GPG + Central token secrets).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create

# Never let two releases publish concurrently.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build-and-test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Derive release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      # The exact binaries the green test matrix ran against.
      - name: Stage prebuilt natives
        uses: actions/download-artifact@v8
        with:
          name: natives-ubuntu
          path: src/main/resources/dev/machineminds/jqpdf/native
      - uses: actions/download-artifact@v8
        with:
          name: natives-macos
          path: src/main/resources/dev/machineminds/jqpdf/native
      - name: Prune unsupported platforms and verify bundle
        run: scripts/release-native-bundle
      - name: Set release version
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Generate Maven settings
        run: |
          # Secrets arrive as env vars; Maven resolves ${env.*} at read time.
          cat > target/release-settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
              <server>
                <id>gpg.passphrase</id>
                <passphrase>${env.GPG_PASSPHRASE}</passphrase>
              </server>
            </servers>
          </settings>
          EOF
      - name: Deploy to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease -DskipTests -s target/release-settings.xml clean deploy
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "jqpdf $VERSION"
